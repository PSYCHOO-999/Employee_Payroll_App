spring.application.name=EmployeePayRollapp

########################################################################
########################################################################

# Database Configuration
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/newdb
spring.datasource.username=root
spring.datasource.password=admin123

# JPA Settings
#spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
#spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# Server Configuration
server.port=8080

##########################################################################
##########################################################################

#Logging Configuration
# Set the default logging level to INFO
logging.level.root=INFO

# Set specific logging levels for packages
logging.level.com.example.employeepayroll=DEBUG

# Log file output configuration
logging.file.name=logs/application.log

# Define log format
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

###########################################################################
# Activate profile
spring.profiles.active=dev
