# ========================================================================
#  Application Configuration
# ========================================================================

spring.application.name=EmployeePayRollapp

# ========================================================================
#  Database Configuration (Using Environment Variables for Security)
# ========================================================================

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/newdb
spring.datasource.username=root
spring.datasource.password=admin123

# ========================================================================
#  JPA & Hibernate Configuration
# ========================================================================

# Dialect for MySQL Database (Ensures Compatibility)
#spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# Update database schema automatically (Use `update` during development, `validate` in production)
spring.jpa.hibernate.ddl-auto=update

# Prevent Hibernate from printing all SQL queries in the terminal
spring.jpa.show-sql=false

# Disable Open Session in View (Prevents performance issues)
spring.jpa.open-in-view=false

# ========================================================================
#  Server Configuration
# ========================================================================

# Change the port if needed
server.port=8080

# ========================================================================
#  Logging Configuration
# ========================================================================

# Set root logging level (Only shows WARN & ERROR messages)
logging.level.root=INFO

# Set logging level for the application (INFO mode to reduce excessive logs)
logging.level.com.bridgelabz.EmployeePayRollapp=DEBUG

# Log file configuration (Save logs in the "logs" directory)
logging.file.name=logs/application.log

# Format console logs (Remove this to stop logging in the terminal)
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %level [%thread] %logger{36} - %msg%n

# File log format
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} - %level [%thread] %logger{36} - %msg%n

# ========================================================================
#  Spring Profile Configuration
# ========================================================================

# Set active profile (dev, staging, or production)
spring.profiles.active=dev
